name: Build DSL Specification PDF

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-pdf:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pandoc and LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pandoc \
            ghostscript \
            doxygen \
            libhdf5-dev \
            fonts-dejavu-core \
            fonts-texgyre \
            texlive-xetex \
            texlive-luatex \
            texlive-latex-extra \
            texlive-fonts-recommended

      - name: Install SNT3 parser for example verification
        run: python -m pip install .

      - name: Build PDF
        run: |
          make -C docs pdf-reference
          python -m pip install 'sphinx>=7,<9' sphinx-rtd-theme 'breathe>=4.36,<5'
          make -C docs doxygen
          python -m sphinx -b html docs/source build/sphinx-html
          test -s build/sphinx-html/dipl-cheatsheet.pdf
          python docs/dipl/cheatsheet/check_outputs.py build/sphinx-html
            
      - name: Determine release tag
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          else
            TAG=$(gh release list --limit 1 --json tagName --jq '.[0].tagName')
          fi

          if [ -z "$TAG" ]; then
            echo "No GitHub Release found."
            exit 1
          fi

          echo "Using release: $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Upload PDF to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          files: |
            build/dipl-specification.pdf
            docs/dipl/cheatsheet/dipl-cheatsheet.pdf
            build/puel-specification.pdf
            build/diph5-specification.pdf
          generate_release_notes: false
          overwrite_files: true
