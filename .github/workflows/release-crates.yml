name: Release Rust crates

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag whose version to assign to crates built from main
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-crates-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
      CRATES_IO_USER_AGENT: snt3-release-workflow (https://github.com/scinumtools/snt3)
    steps:
      - name: Check selected release
        env:
          GH_TOKEN: ${{ github.token }}
          CRATES_IO_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: |
          test -n "$RELEASE_TAG"
          draft=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)
          test "$draft" = false || { echo "Release $RELEASE_TAG is still a draft" >&2; exit 1; }
          test -n "$CRATES_IO_TOKEN" || {
            echo "Configure the CRATES_IO_TOKEN repository secret before publishing" >&2
            exit 1
          }

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.event.release.tag_name }}
          persist-credentials: false

      - name: Check release and set crate versions
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a release tag such as v0.10.0, got $RELEASE_TAG" >&2
            exit 1
          fi
          version="${RELEASE_TAG#v}"
          native_version=$(sed -n 's/^CODE_VERSION=//p' settings.env)
          if [ "$GITHUB_EVENT_NAME" = release ]; then
            test "$version" = "$native_version" || {
              echo "Release tag $RELEASE_TAG does not match SNT3 version $native_version" >&2
              exit 1
            }
            test "$(git describe --tags --exact-match HEAD)" = "$RELEASE_TAG" || {
              echo "The checked-out commit is not tagged $RELEASE_TAG" >&2
              exit 1
            }
          fi
          if [ ! -f bindings/rust/sync_version.py ] ||
             [ ! -f bindings/rust/Cargo.toml ]; then
            echo "Selected source commit lacks bindings/rust." >&2
            exit 1
          fi
          python3 bindings/rust/sync_version.py --write --version "$version"
          echo "Building native SNT3 $native_version from $(git rev-parse --short HEAD)"
          echo "Publishing Rust crates $version for release $RELEASE_TAG"
          {
            echo "Source commit: $(git rev-parse HEAD)"
            echo "Native SNT3 version: $native_version"
            echo "Rust crate version: $version"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "CRATE_VERSION=$version" >> "$GITHUB_ENV"
          echo "SNT3_PREFIX=$RUNNER_TEMP/snt3-rust" >> "$GITHUB_ENV"

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libhdf5-dev pkg-config

      - name: Build SNT3 C ABI
        run: |
          cmake -S . -B build-rust -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$SNT3_PREFIX" \
            -DENABLE_BINDING_C=ON \
            -DENABLE_BINDING_PYTHON=OFF \
            -DENABLE_UNIT_TESTS=OFF \
            -DENABLE_EXEC_APPS=OFF \
            -DENABLE_EXEC_EXAMPLES=OFF \
            -DENABLE_EXEC_BENCHMARKS=OFF \
            -DENABLE_SNT_REPORT=OFF \
            -DENABLE_MAT=OFF \
            -DENABLE_API=OFF
          cmake --build build-rust --target snt-c --parallel 4
          cmake --install build-rust

      - name: Test Rust crates
        run: cargo test --manifest-path bindings/rust/Cargo.toml --workspace --locked

      - name: Package and verify bundled native source
        run: |
          python3 bindings/rust/scinumtools3-sys/prepare_vendor.py
          env -u SNT3_PREFIX -u SNT3_BUILD_DIR cargo package --manifest-path bindings/rust/Cargo.toml \
            -p scinumtools3-sys --locked --allow-dirty

      - name: Publish scinumtools3-sys
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: |
          status=$(curl -sS -A "$CRATES_IO_USER_AGENT" -o /dev/null -w '%{http_code}' \
            "https://crates.io/api/v1/crates/scinumtools3-sys/$CRATE_VERSION")
          case "$status" in
            200) echo "scinumtools3-sys $CRATE_VERSION is already published" ;;
            404) cargo publish --manifest-path bindings/rust/Cargo.toml \
                   -p scinumtools3-sys --locked --allow-dirty ;;
            *) echo "Could not check scinumtools3-sys: HTTP $status" >&2; exit 1 ;;
          esac

      - name: Wait for the sys crate in the registry
        run: |
          for attempt in {1..30}; do
            status=$(curl -sS -A "$CRATES_IO_USER_AGENT" -o /dev/null -w '%{http_code}' \
              "https://crates.io/api/v1/crates/scinumtools3-sys/$CRATE_VERSION")
            if [ "$status" = 200 ]; then exit 0; fi
            if [ "$status" != 404 ]; then
              echo "Could not check scinumtools3-sys: HTTP $status" >&2
              exit 1
            fi
            sleep 10
          done
          echo "scinumtools3-sys $CRATE_VERSION did not appear in crates.io" >&2
          exit 1

      - name: Publish scinumtools3
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: |
          status=$(curl -sS -A "$CRATES_IO_USER_AGENT" -o /dev/null -w '%{http_code}' \
            "https://crates.io/api/v1/crates/scinumtools3/$CRATE_VERSION")
          case "$status" in
            200) echo "scinumtools3 $CRATE_VERSION is already published" ;;
            404) cargo publish --manifest-path bindings/rust/Cargo.toml \
                   -p scinumtools3 --locked --allow-dirty ;;
            *) echo "Could not check scinumtools3: HTTP $status" >&2; exit 1 ;;
          esac
