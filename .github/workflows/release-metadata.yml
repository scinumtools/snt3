name: Release Packaging Info

on:
  release:
    types: [published]

  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (leave empty for latest)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  packaging:
    runs-on: ubuntu-latest

    steps:
      - name: Determine release tag
        id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          elif [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          else
            TAG=$(gh release list --limit 1 --json tagName --jq '.[0].tagName')
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Download source archives
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir source
          cd source

          gh api \
            repos/${{ github.repository }}/tarball/${{ steps.tag.outputs.tag }} \
            > source.tar.gz

          gh api \
            repos/${{ github.repository }}/zipball/${{ steps.tag.outputs.tag }} \
            > source.zip

      - name: Compute hashes
        id: hash
        run: |
          cd source

          echo "tar_sha256=$(sha256sum source.tar.gz | cut -d' ' -f1)" >> $GITHUB_OUTPUT
          echo "tar_sha512=$(sha512sum source.tar.gz | cut -d' ' -f1)" >> $GITHUB_OUTPUT

          echo "zip_sha256=$(sha256sum source.zip | cut -d' ' -f1)" >> $GITHUB_OUTPUT
          echo "zip_sha512=$(sha512sum source.zip | cut -d' ' -f1)" >> $GITHUB_OUTPUT

      - name: Update release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"

          BODY=$(gh release view "$TAG" --json body --jq .body)

          # Remove an existing Packaging section (if present)
          BODY=$(printf "%s" "$BODY" | awk '
            BEGIN {skip=0}
            /^## 📦 Packaging$/ {skip=1; next}
            skip && /^---$/ {skip=0; next}
            !skip {print}
          ')

          cat > body.md <<EOF
## 📦 Packaging

| Archive | SHA256 | SHA512 |
|----------|--------|---------|
| Source code (tar.gz) | \`${{ steps.hash.outputs.tar_sha256 }}\` | \`${{ steps.hash.outputs.tar_sha512 }}\` |
| Source code (zip) | \`${{ steps.hash.outputs.zip_sha256 }}\` | \`${{ steps.hash.outputs.zip_sha512 }}\` |

---

$BODY
EOF

          gh release edit "$TAG" --notes-file body.md