name: Build and Publish on PyPI

on:
  release:
    types: [published]
    
  workflow_dispatch:
  
jobs:
  build_wheels:
    name: Build wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # Only used for helper commands below.
      # cibuildwheel uses its own Python installations.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtest-dev libhdf5-dev pybind11-dev

      - name: macOS dependencies
        if: runner.os == 'macOS'
        run: |
          brew install googletest hdf5 pybind11
          echo "HDF5_ROOT=$(brew --prefix hdf5)" >> "$GITHUB_ENV"

      - name: Windows dependencies
        if: runner.os == 'Windows'
        shell: bash
        run: |
          vcpkg install hdf5:x64-windows
          echo "CMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake" >> "$GITHUB_ENV"
          echo "VCPKG_TARGET_TRIPLET=x64-windows" >> "$GITHUB_ENV"
          echo "HDF5_ROOT=C:/vcpkg/installed/x64-windows" >> "$GITHUB_ENV"

      - name: Build wheels
        uses: pypa/cibuildwheel@v2.23
        env:
          CIBW_BUILD_VERBOSITY: 1
          CIBW_ARCHS_WINDOWS: AMD64
          CIBW_ARCHS_LINUX: auto64
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28  # to enforce GCC 11+
          CIBW_MANYLINUX_AARCH64_IMAGE: manylinux_2_28
          CIBW_BEFORE_ALL_LINUX: yum install -y hdf5-devel
          CIBW_ENVIRONMENT_WINDOWS: >-
            CMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake
            VCPKG_TARGET_TRIPLET=x64-windows
            HDF5_ROOT=C:/vcpkg/installed/x64-windows
          CIBW_TEST_COMMAND: python -c "import scinumtools3; print('Success!')"
          CMAKE_ARGS: >-
            -DENABLE_UNIT_TESTS=OFF
            -DENABLE_BINDING_C=OFF
            -DENABLE_EXEC_APPS=OFF
            -DENABLE_EXEC_EXAMPLES=OFF
            -DENABLE_EXEC_BENCHMARKS=OFF
          
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  build_sdist:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build source distribution
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          python -m build --sdist

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    needs:
      - build_wheels
      - build_sdist

    runs-on: ubuntu-latest

    permissions:
      id-token: write

    environment:
      name: pypi

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Flatten artifact directories
        run: |
          mkdir upload
          find dist -type f \( -name "*.whl" -o -name "*.tar.gz" \) -exec cp {} upload/ \;

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: upload
