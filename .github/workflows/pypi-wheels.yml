name: Build and Publish on PyPI

on:
  release:
    types: [published]

  workflow_dispatch:

jobs:
  build_wheels:
    name: Build wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-14

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtest-dev libhdf5-dev pybind11-dev

      - name: macOS dependencies
        id: macos_hdf5
        if: runner.os == 'macOS'
        run: |
          brew install googletest hdf5 pybind11
          hdf5_root="$(brew --prefix hdf5)"
          echo "HDF5_ROOT=$hdf5_root" >> "$GITHUB_ENV"
          echo "hdf5_root=$hdf5_root" >> "$GITHUB_OUTPUT"

      - name: Windows dependencies
        if: runner.os == 'Windows'
        shell: bash
        run: |
          vcpkg install hdf5:x64-windows
          echo "CMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake" >> "$GITHUB_ENV"
          echo "VCPKG_TARGET_TRIPLET=x64-windows" >> "$GITHUB_ENV"
          echo "HDF5_ROOT=C:/vcpkg/installed/x64-windows" >> "$GITHUB_ENV"

      - name: Build wheels
        uses: pypa/cibuildwheel@v2.23
        env:
          CIBW_BUILD_VERBOSITY: 1
          CIBW_ARCHS_WINDOWS: AMD64
          CIBW_ARCHS_LINUX: auto64
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          CIBW_MANYLINUX_AARCH64_IMAGE: manylinux_2_28
          CIBW_BEFORE_ALL_LINUX: >-
            yum install -y hdf5 hdf5-devel
          CIBW_ENVIRONMENT_LINUX: >-
            HDF5_ROOT=/usr
            CMAKE_PREFIX_PATH=/usr
            LD_LIBRARY_PATH=/usr/lib64:/usr/lib
          CIBW_ENVIRONMENT_WINDOWS: >-
            CMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake
            VCPKG_TARGET_TRIPLET=x64-windows
            CMAKE_PREFIX_PATH=C:/vcpkg/installed/x64-windows
            HDF5_ROOT=C:/vcpkg/installed/x64-windows
          CIBW_ENVIRONMENT_MACOS: >-
            HDF5_ROOT=${{ steps.macos_hdf5.outputs.hdf5_root }}
            CMAKE_PREFIX_PATH=${{ steps.macos_hdf5.outputs.hdf5_root }}
            DYLD_FALLBACK_LIBRARY_PATH=${{ steps.macos_hdf5.outputs.hdf5_root }}/lib
            MACOSX_DEPLOYMENT_TARGET=14.0
          CIBW_REPAIR_WHEEL_COMMAND_MACOS: >-
            MACOSX_DEPLOYMENT_TARGET=14.0
            DYLD_FALLBACK_LIBRARY_PATH=${{ steps.macos_hdf5.outputs.hdf5_root }}/lib
            delocate-wheel --require-archs {delocate_archs} -w {dest_dir} -v {wheel}
          CIBW_BEFORE_BUILD_WINDOWS: pip install delvewheel
          CIBW_REPAIR_WHEEL_COMMAND_WINDOWS: >-
            delvewheel repair --add-path C:/vcpkg/installed/x64-windows/bin
            -w {dest_dir} {wheel}
          CIBW_TEST_COMMAND: python -c "import scinumtools3; print('Success!')"
          CMAKE_ARGS: >-
            -DHDF5_USE_STATIC_LIBRARIES=OFF
            -DENABLE_UNIT_TESTS=OFF
            -DENABLE_BINDING_C=OFF
            -DENABLE_EXEC_APPS=OFF
            -DENABLE_EXEC_EXAMPLES=OFF
            -DENABLE_EXEC_BENCHMARKS=OFF

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  build_sdist:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build source distribution
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          python -m build --sdist

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    needs:
      - build_wheels
      - build_sdist

    runs-on: ubuntu-latest

    permissions:
      id-token: write

    environment:
      name: pypi

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Flatten artifact directories
        run: |
          mkdir upload
          find dist -type f \( -name "*.whl" -o -name "*.tar.gz" \) -exec cp {} upload/ \;

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: upload
