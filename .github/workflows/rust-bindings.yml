name: Rust bindings

on:
  push:
    branches: [main]
    paths:
      - 'bindings/**'
      - 'src/**'
      - 'include/**'
      - 'external/nlohmann/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - 'settings.env'
      - '.github/workflows/rust-bindings.yml'
  pull_request:
    branches: [main]
    paths:
      - 'bindings/**'
      - 'src/**'
      - 'include/**'
      - 'external/nlohmann/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - 'settings.env'
      - '.github/workflows/rust-bindings.yml'
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            compiler: gcc
          - os: ubuntu-22.04
            compiler: clang-libcxx
          - os: macos-latest
            compiler: appleclang
          - os: windows-2022
            compiler: msvc
    name: ${{ matrix.os }} (${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    env:
      SNT3_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang g++ libc++-dev libc++abi-dev libhdf5-dev pkg-config

      - name: Select Clang and libc++
        if: matrix.compiler == 'clang-libcxx'
        run: |
          echo 'CC=clang' >> "$GITHUB_ENV"
          echo 'CXX=clang++' >> "$GITHUB_ENV"
          echo 'CXXFLAGS=-stdlib=libc++' >> "$GITHUB_ENV"

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: |
          brew install hdf5
          echo "HDF5_ROOT=$(brew --prefix hdf5)" >> "$GITHUB_ENV"

      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Windows dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          vcpkg install hdf5:x64-windows
          'CMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake' >> $env:GITHUB_ENV
          'VCPKG_TARGET_TRIPLET=x64-windows' >> $env:GITHUB_ENV
          'HDF5_ROOT=C:/vcpkg/installed/x64-windows' >> $env:GITHUB_ENV
          'SNT3_HDF5_LIB_DIR=C:/vcpkg/installed/x64-windows/lib' >> $env:GITHUB_ENV
          'C:/vcpkg/installed/x64-windows/bin' >> $env:GITHUB_PATH

      - name: Test Rust workspace
        run: cargo test --manifest-path bindings/rust/Cargo.toml --workspace --locked

      - name: Verify the bundled Linux crate
        if: matrix.compiler == 'gcc'
        run: |
          python3 bindings/rust/scinumtools3-sys/prepare_vendor.py
          cargo package --manifest-path bindings/rust/Cargo.toml \
            -p scinumtools3-sys --locked --allow-dirty
