name: Build


on:
  push:
    branches: [ "main" ]
    paths:
      - 'src/**'
      - 'include/**'
      - 'bindings/**'
      - 'benchmarks/**'
      - 'examples/**'
      - 'apps/**'
      - 'tests/**'
      - 'CMakeLists.txt'
      - 'pyproject.toml'
      - 'packaging/vcpkg/**'
      - '.github/workflows/c-cpp-build.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'src/**'
      - 'include/**'
      - 'bindings/**'
      - 'benchmarks/**'
      - 'examples/**'
      - 'apps/**'
      - 'tests/**'
      - 'CMakeLists.txt'
      - 'pyproject.toml'
      - 'packaging/vcpkg/**'
      - '.github/workflows/c-cpp-build.yml'

jobs:
  windows-x86-dip:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: x86

      - name: Install x86 Python dependencies
        run: python -m pip install numpy pytest pytest-cmake pytest-benchmark pybind11

      - name: Install x86 dependencies
        run: vcpkg install hdf5:x86-windows gtest:x86-windows

      - name: Configure x86 source build
        run: >-
          cmake -S . -B build-x86 -G "Visual Studio 17 2022" -A Win32
          -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake
          -DVCPKG_TARGET_TRIPLET=x86-windows
          -DHDF5_ROOT=C:/vcpkg/installed/x86-windows
          -DENABLE_UNIT_TESTS=ON
          -DENABLE_BINDING_PYTHON=ON
          -DENABLE_BINDING_C=ON
          -DENABLE_EXEC_APPS=ON
          -DENABLE_EXEC_EXAMPLES=ON
          -DENABLE_MAT=ON
          -DENABLE_SNT_REPORT=ON
          -DENABLE_SNT_SERVER=ON
          -DENABLE_SNT_VIEW=ON

      - name: Build x86 source
        run: cmake --build build-x86 --config Release --parallel 4

      - name: Test x86 DIPH5 conversions
        run: ctest --test-dir build-x86 -C Release -R "Environment.Checks.*SizeT" --output-on-failure

      - name: Test x86 source
        run: ctest --test-dir build-x86 -C Release --output-on-failure

      - name: Install x86 vcpkg port
        run: vcpkg install scinumtools3:x86-windows --overlay-ports=packaging/vcpkg

  build:
    strategy:
      matrix:
        os: 
          - ubuntu-latest
          - macos-latest
          - windows-latest

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pytest pytest-cmake pytest-benchmark
          #pip install ".[test]"
          
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtest-dev libhdf5-dev pybind11-dev \
            libgl-dev libglvnd-dev libx11-dev libxext-dev libxrandr-dev \
            libxinerama-dev libxcursor-dev libxi-dev \
            libwayland-dev libwayland-bin libxkbcommon-dev wayland-protocols pkg-config
          
      - name: macOS dependencies
        if: runner.os == 'macOS'
        run: |
          brew install googletest hdf5 pybind11
          echo "HDF5_ROOT=$(brew --prefix hdf5)" >> "$GITHUB_ENV"

      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Windows dependencies
        if: runner.os == 'Windows'
        shell: bash
        run: |
          vcpkg install hdf5:x64-windows
          echo "CMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake" >> "$GITHUB_ENV"
          echo "VCPKG_TARGET_TRIPLET=x64-windows" >> "$GITHUB_ENV"
          echo "HDF5_ROOT=C:/vcpkg/installed/x64-windows" >> "$GITHUB_ENV"

      - name: Build (Linux/macOS)
        if: runner.os != 'Windows'
        run: ./setup.sh --github-workflows -b

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: ./setup.sh --github-workflows -b

      - name: Test (Linux/macOS)
        if: runner.os != 'Windows'
        run: ./setup.sh -t

      - name: Test (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: ./setup.sh -t
        
