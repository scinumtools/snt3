[workspace]
members = ["scinumtools3-sys", "scinumtools3", "scinumtools3-build"]
resolver = "2"

[workspace.package]
version = "0.10.0"

[workspace.dependencies]
scinumtools3-sys = { version = "=0.10.0", path = "scinumtools3-sys" }
