<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1840" height="855" viewBox="0 0 1840 855" role="img" aria-labelledby="title desc">
  <title id="title">DIPL architecture</title>
  <desc id="desc">Scientific parameters with physical units, hierarchies, references, constraints, and provenance flow through a C++ core that validates, evaluates, and supports a DIPH5 experiment contract. Interfaces include C, Rust, Python, WebAssembly, command line, CMake, REST, MCP, and a parameter viewer.</desc>
