<svg xmlns="http://www.w3.org/2000/svg" width="750" height="240" viewBox="0 0 750 240" role="img" aria-labelledby="title desc">
  <title id="title">SNTv3</title>
  <desc id="desc">Scientific Numerical Tools wordmark beside a gear with code braces.</desc>

  <!-- Gear from the flyer's tool imagery; braces recall the v2 code symbol. -->
  <g fill="#0b2d4b">
    <circle cx="116" cy="120" r="73"/>
    <rect x="99" y="20" width="34" height="60" rx="4"/>
    <rect x="99" y="20" width="34" height="60" rx="4" transform="rotate(45 116 120)"/>
    <rect x="99" y="20" width="34" height="60" rx="4" transform="rotate(90 116 120)"/>
    <rect x="99" y="20" width="34" height="60" rx="4" transform="rotate(135 116 120)"/>
    <rect x="99" y="20" width="34" height="60" rx="4" transform="rotate(180 116 120)"/>
    <rect x="99" y="20" width="34" height="60" rx="4" transform="rotate(225 116 120)"/>
    <rect x="99" y="20" width="34" height="60" rx="4" transform="rotate(270 116 120)"/>
    <rect x="99" y="20" width="34" height="60" rx="4" transform="rotate(315 116 120)"/>
  </g>
  <g fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round" stroke-width="9">
    <path d="M101 85c-9 0-12 4-12 12v12c0 7-3 10-9 11 6 1 9 4 9 11v12c0 8 3 12 12 12"/>
    <path d="M101 85c-9 0-12 4-12 12v12c0 7-3 10-9 11 6 1 9 4 9 11v12c0 8 3 12 12 12" transform="translate(232 0) scale(-1 1)"/>
  </g>

  <text x="245" y="173" font-family="Arial, Helvetica, sans-serif" font-size="155" font-weight="700" letter-spacing="-6" paint-order="stroke fill"><tspan fill="#0b2d4b" stroke="#ffffff" stroke-width="5">SNT</tspan><tspan fill="#ffffff" stroke="#0b2d4b" stroke-width="5">v3</tspan></text>
</svg>
